name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the runtime in the production image (see Dockerfile);
        # 3.12 is the local dev venv. Both must stay green so a version-only
        # breakage cannot reach :latest untested.
        python-version: ["3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q
        env:
          SECRET_KEY: ci-test-secret-key-not-for-prod
          FLASK_TESTING: "1"
          WTF_CSRF_ENABLED: "0"
